[project]
name = "crypalgos-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Crypalgos", email = "crypalgos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "websockets>=16.0",
    "pyzmq>=27.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
crypalgos-streamer = "crypalgos_data.stream.runner:main"


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "requests-mock>=1.12.1",
]


[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
